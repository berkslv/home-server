services:
  # Cloudflare Tunnel - outbound-only connector, no inbound ports on the router
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN is required, run cloudflare/setup.sh}
    networks:
      - home-server
    depends_on:
      - agent

  # Agent - Ubuntu dev box with CLI tooling, reachable at ssh.berkslv.com
  agent:
    build: ./agent
    image: home-server/agent:latest
    container_name: agent
    hostname: agent
    restart: unless-stopped
    environment:
      - AUTHORIZED_KEYS=${AUTHORIZED_KEYS:?AUTHORIZED_KEYS is required}
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      - agent_home:/home/agent
      - agent_ssh_keys:/etc/ssh/keys
    # Uncomment for direct LAN access (bypasses Cloudflare Access)
    # ports:
    #   - "2222:22"
    networks:
      - home-server
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  home-server:
    driver: bridge

volumes:
  agent_home:
  agent_ssh_keys:
