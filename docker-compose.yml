services:
  # Agent - Ubuntu dev box with CLI tooling. cloudflared runs on the host and
  # tunnels ssh.berkslv.com to the host's sshd; the agent is one hop further:
  # `ssh agent` (ProxyJump via ssh.berkslv.com, see README)
  agent:
    build: ./agent
    image: home-server/agent:latest
    container_name: agent
    hostname: agent
    restart: unless-stopped
    environment:
      - AUTHORIZED_KEYS=${AUTHORIZED_KEYS:?AUTHORIZED_KEYS is required}
      - TZ=${TZ:-Europe/Istanbul}
      - GH_TOKEN=${GH_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - VENICE_API_KEY=${VENICE_API_KEY:-}
    volumes:
      - agent_home:/home/agent
      - agent_ssh_keys:/etc/ssh/keys
    # Host-only; reach it from the Pi with `ssh -p 2222 agent@localhost`
    ports:
      - "127.0.0.1:2222:22"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent_home:
  agent_ssh_keys:
